publiccodeYmlVersion: "0"

name: oidfed_metadata_policy
url: "https://github.com/SUNET/oidfed_metadata_policy"
platforms:
  - mac
  - linux

categories:
  - identity-management

usedBy:
  - Sunet

developmentStatus: development

softwareType: "library"

description:
  en:
    shortDescription: >
        Implementation of metadata policy rules of OpenID Federation 1.0.

    longDescription: >
        A Rust library implementing the metadata policy resolve and apply
        methods defined in OpenID Federation 1.0 (draft 43). It exposes
        primitives to merge policy documents along a trust chain and to
        apply a resolved policy to a metadata statement, so federation
        operators can enforce policy at any node of the chain.
    features:
      - Metadata resolve
      - Metadata policy merge 

